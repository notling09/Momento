name: momento
description: "Momento - Deine App fuer Erinnerungen und besondere Momente"
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Persistenz (lokal) - funktioniert auf Android, iOS und Web
  shared_preferences: ^2.3.0

  # Medien
  image_picker: ^1.1.2
  record: ^7.1.1
  audioplayers: ^6.1.0
  path_provider: ^2.1.4

  # Symbolschrift fuer die iOS-typischen Icons in Uebergaengen
  cupertino_icons: ^1.0.8

  # Sicherung: ZIP-Datei erzeugen, speichern und wieder einlesen
  archive: ^4.0.2
  file_picker: ^12.1.2

  # Hilfsmittel
  uuid: ^4.5.1
  intl: ^0.20.2
  crypto: ^3.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  image: ^4.2.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
  fonts:
    - family: Quicksand
      fonts:
        - asset: assets/fonts/Quicksand-Regular.ttf
          weight: 400
        - asset: assets/fonts/Quicksand-Medium.ttf
          weight: 500
        - asset: assets/fonts/Quicksand-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Quicksand-Bold.ttf
          weight: 700
    - family: Baloo
      fonts:
        - asset: assets/fonts/Baloo2-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Baloo2-Bold.ttf
          weight: 700
        - asset: assets/fonts/Baloo2-ExtraBold.ttf
          weight: 800
